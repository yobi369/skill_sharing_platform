name: Repository quality

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: skillchain_test
          POSTGRES_USER: skillchain
          POSTGRES_PASSWORD: skillchain_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skillchain -d skillchain_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://skillchain:skillchain_test_password@localhost:5432/skillchain_test
      JWT_SECRET: ci-test-secret-that-is-long-enough-for-hmac-signing
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Audit installed dependencies
        run: npm audit --audit-level=high

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s SECURITY.md
          test -s docs/ARCHITECTURE.md
          test -s docs/ROADMAP.md
          test -s CONTRIBUTING.md
          test -s package.json
          test -s Dockerfile
          test -s .dockerignore
          test -s compose.yaml
          test -s .env.example
          test -s db/schema.sql
          test -s src/server.js
          test -s tests/api.integration.test.js
          test -s tests/web-contract.test.cjs
          test -s web/index.html
          test -s web/app.js
          test -s web/styles.css
          test -s web/config.js
          test -s tests/prototype-contract.test.cjs
          test -s scripts/check-inline-scripts.cjs
          test -s scripts/migrate.js
          test -s skill_sharing_platform.html
          grep -qi '<!DOCTYPE html' skill_sharing_platform.html
          grep -qi '<html' skill_sharing_platform.html
          grep -qi '</html>' skill_sharing_platform.html
          echo "Required documentation, API, database, and HTML checks passed."

      - name: Apply database schema
        run: npm run migrate

      - name: Verify JavaScript syntax
        run: npm run check:syntax

      - name: Run prototype and API integration tests
        run: npm test

      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet

      - name: Build production API container
        run: docker build --tag skillchain-api:ci .

      - name: Check for obvious committed secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=.github --exclude-dir=node_modules --exclude='*.pdf' '(BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,})' .; then
            echo "::error::Potential secret pattern detected. Review the match before proceeding."
            exit 1
          fi
          echo "No obvious private-key or token patterns detected."
