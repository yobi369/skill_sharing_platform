name: Repository quality

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required project files
        shell: bash
        run: |
          set -euo pipefail
          test -s README.md
          test -s SECURITY.md
          test -s docs/ARCHITECTURE.md
          test -s docs/ROADMAP.md
          test -s CONTRIBUTING.md
          test -s package.json
          test -s tests/prototype-contract.test.cjs
          test -s scripts/check-inline-scripts.cjs
          test -s skill_sharing_platform.html
          grep -qi '<!DOCTYPE html' skill_sharing_platform.html
          grep -qi '<html' skill_sharing_platform.html
          grep -qi '</html>' skill_sharing_platform.html
          echo "Required documentation and HTML structure checks passed."

      - name: Verify embedded JavaScript syntax
        run: npm run check:syntax

      - name: Run prototype contract tests
        run: npm test

      - name: Check for obvious committed secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=.github --exclude='*.pdf' '(BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{30,})' .; then
            echo "::error::Potential secret pattern detected. Review the match before proceeding."
            exit 1
          fi
          echo "No obvious private-key or token patterns detected."
