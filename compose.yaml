services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skillchain}
      POSTGRES_USER: ${POSTGRES_USER:-skillchain}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - skillchain-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skillchain} -d ${POSTGRES_DB:-skillchain}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to the database service}
      DATABASE_SSL: "false"
      HOST: 0.0.0.0
      PORT: 3000
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-c", "npm run migrate && npm start"]
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  skillchain-data:
